<!DOCTYPE html>
<!--
  PLANTILLA HISTORIA IG · PRIME — 1080×1920
  Igual que historia-ig-template.html, pero con un sticker "prime -XX%" en la
  esquina superior derecha de la foto. Usarla SOLO cuando la ficha de Amazon
  muestre un precio exclusivo para miembros Prime.
  · {{ PRICE }}           → el precio Prime (el que paga quien tiene Prime)
  · {{ PRICE_BEFORE_HTML }} → el precio normal tachado
  · {{ PRIME_PCT }}       → porcentaje de ahorro, ej: -9%  (sin texto adicional)
  El resto de variables es idéntico a la plantilla normal (Paso 12 de /agregar-link).

  Zonas seguras de Instagram (no poner contenido importante ahí):
  · Top 0–250px    → IG superpone tu foto de perfil, nombre y la X
  · Bottom 1640–1920px → IG superpone la barra "Enviar mensaje"
  El sticker de link se coloca ENCIMA del pill "Link en mi bio".
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Historia IG Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #F4DDD7; --surface: #FBEAE4; --cream: #FAF1E8; --card: #FFFFFF;
    --ink: #3B2521; --muted: #9C7A6F; --accent: #A04A36; --rule: #E5C9C0; --gold: #C9985E;
  }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .story {
    width: 1080px; height: 1920px; position: relative;
    background:
      radial-gradient(ellipse at top left, rgba(201,152,94,0.16) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(160,74,54,0.10) 0%, transparent 50%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center;
  }
  .deco1 { position:absolute; top:-160px; right:-160px; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle,rgba(160,74,54,0.10) 0%,transparent 70%); }
  .deco2 { position:absolute; bottom:140px; left:-140px; width:440px; height:440px; border-radius:50%; background:radial-gradient(circle,rgba(201,152,94,0.14) 0%,transparent 70%); }

  /* Zona segura superior: el contenido empieza en ~270px */
  .kicker {
    position:relative; z-index:10; margin-top:270px;
    display:flex; align-items:center; gap:22px;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:42px; font-weight:600; color:var(--muted);
    letter-spacing:6px; text-transform:uppercase;
  }
  .kicker-line { width:80px; height:1.5px; background:var(--rule); }

  .cat-pill {
    position:relative; z-index:10; margin-top:26px;
    background:var(--accent); color:#fff;
    padding:14px 40px; border-radius:60px;
    font-size:30px; font-weight:700; letter-spacing:1px;
  }

  .img-wrap {
    position:relative; z-index:10; margin-top:44px;
    width:880px; height:880px; border-radius:44px; overflow:visible; min-height:0;
    background:var(--card);
    box-shadow:0 8px 24px rgba(59,37,33,0.08), 0 36px 90px rgba(59,37,33,0.14);
  }
  .img-wrap img { width:100%; height:100%; object-fit:contain; padding:36px; border-radius:44px; }
  .img-badge {
    position:absolute; top:30px; left:30px;
    background:var(--accent); color:#fff;
    font-size:28px; font-weight:700; padding:14px 30px; border-radius:44px;
  }
  .discount-badge {
    position:absolute; bottom:30px; left:30px;
    background:var(--gold); color:#fff;
    font-size:32px; font-weight:800; padding:16px 32px; border-radius:44px;
  }

  .prod-title {
    position:relative; z-index:10; margin-top:52px;
    width:940px; text-align:center;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:64px; font-weight:700; color:var(--ink); line-height:1.15;
  }

  .price-row {
    position:relative; z-index:10; margin-top:30px;
    display:flex; align-items:baseline; gap:28px;
    flex-wrap:wrap; justify-content:center; max-width:1000px;
  }
  .price-before { font-size:40px; color:var(--muted); text-decoration:line-through; font-weight:500; }
  .price-now { font-size:88px; font-weight:800; color:var(--accent); letter-spacing:-2px; }

  .ship-line {
    position:relative; z-index:10; margin-top:22px;
    font-size:32px; font-weight:600; color:var(--ink);
    display:flex; align-items:center; gap:14px;
  }
  .ship-line .ok { color:var(--accent); }

  /* Pill donde va el sticker de link (colocarlo encima en IG).
     Queda bien aunque el sticker lo tape parcial o totalmente. */
  .cta {
    position:relative; z-index:10; margin-top:30px; margin-bottom:270px;
    background:var(--ink); color:#fff;
    padding:34px 72px; border-radius:70px;
    display:flex; align-items:center; gap:24px;
    font-size:38px; font-weight:700;
    box-shadow:0 16px 40px rgba(59,37,33,0.22);
  }
  .cta .arrow { color:var(--gold); font-size:44px; }

  .firma {
    position:absolute; bottom:200px; left:0; width:100%;
    text-align:center;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic; font-size:34px; color:var(--muted);
    letter-spacing:2px;
  }

  /* Sticker Prime: logo + % de descuento, sin más texto */
  .prime-sticker {
    position:absolute; top:-84px; right:-22px; z-index:20;
    transform:rotate(7deg);
    filter:drop-shadow(0 10px 14px rgba(0,0,0,0.25));
    font-family:'Lilita One',sans-serif;
  }
  .prime-sticker .cut { background:#fff; border-radius:44px; padding:14px; }
  .prime-sticker .face {
    border:3px solid #CFE9F7; border-radius:32px;
    padding:14px 34px 12px; text-align:center; background:#fff;
  }
  .prime-sticker svg { display:block; margin:0 auto; }
  .prime-sticker .pct { color:#0B5FA5; font-size:84px; line-height:1; white-space:nowrap; margin-top:2px; }
</style>
</head>
<body>
<div class="story">
  <div class="deco1"></div><div class="deco2"></div>

  <div class="kicker"><div class="kicker-line"></div>Pick del día<div class="kicker-line"></div></div>
  <div class="cat-pill">{{ CATEGORIA_LABEL }}</div>

  <div class="img-wrap">
    <img src="{{ IMAGE_URL }}" alt="{{ TITLE_CORTO }}">
    <div class="img-badge">{{ RATING_BADGE }}</div>
    <div class="prime-sticker"><div class="cut"><div class="face">
      <svg viewBox="0 0 210 150" width="210" xmlns="http://www.w3.org/2000/svg" aria-label="Amazon Prime"><text x="105" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="80" letter-spacing="-4" fill="#1799DB">prime</text><path d="M14 112 Q104 152 184 102" fill="none" stroke="#1799DB" stroke-width="9" stroke-linecap="round"/><path d="M167 96 L189 100 L181 120" fill="none" stroke="#1799DB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="pct">{{ PRIME_PCT }}</div>
    </div></div></div>
    {{ DISCOUNT_BADGE_HTML }}
  </div>

  <div class="prod-title">{{ TITULO_DISPLAY }}</div>

  <div class="price-row">
    {{ PRICE_BEFORE_HTML }}
    <span class="price-now">{{ PRICE }}</span>
  </div>

  {{ SHIPPING_HTML }}

  <div class="cta">Link en mi bio <span class="arrow">👇</span></div>
  <div class="firma">✦ &nbsp;bibi recomienda&nbsp; ✦</div>
</div>
</body>
</html>
